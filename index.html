<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        button {
            touch-action: manipulation;
        }
        /* 모바일 사파리에서 입력창 포커스 시 자동 확대 방지 (16px 이상) */
        input[type="text"] {
            font-size: 16px;
        }
        .map-pin {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .map-pin.active {
            animation: pulse-glow 0.8s infinite alternate;
        }
        @keyframes pulse-glow {
            from { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 8px #22c55e; }
            to { transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 0 18px #4ade80; }
        }

        .puzzle-drop-zone {
            min-height: 80px;
            touch-action: none;
        }
        .puzzle-piece {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .puzzle-piece:active {
            cursor: grabbing;
        }
    </style>
</head>

                    <span class="text-slate-400">경계 수치:</span>
                    <span id="alert-gauge" class="font-bold text-red-500">0%</span>
                </div>

                    <span class="text-slate-400">남은 시간:</span>

            <button onclick="startGame()" id="start-btn" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-lg shadow-lg opacity-50 cursor-not-allowed transition" disabled>
                작전 개시
            </button>
        </section>

                </div>
                <button onclick="useCharacterSkill()" id="skill-btn" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded shadow transition">

            </div>

            <!-- 대화창 -->

                    <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
                    <span id="dialogue-speaker" class="font-bold text-sm text-amber-300">이름</span>

        function loadImageEl(src) {

        // dHash(차분 해시): 밝기 변화 패턴을 비트로 인코딩해 구도/윤곽 유사도를 비교
        function computeDHash(img) {
            const w = 9, h = 8;
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const data = ctx.getImageData(0, 0, w, h).data;
            const gray = [];
            for (let i = 0; i < data.length; i += 4) {
                gray.push(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
            }
            let hash = '';
            for (let row = 0; row < h; row++) {
                for (let col = 0; col < w - 1; col++) {
                    const left = gray[row * w + col];
                    const right = gray[row * w + col + 1];
                    hash += left > right ? '1' : '0';
                }
            }
            return hash;
        }

        function hashSimilarity(hashA, hashB) {
            let diff = 0;
            for (let i = 0; i < hashA.length; i++) {
                if (hashA[i] !== hashB[i]) diff++;
            }
            return 1 - diff / hashA.length;
        }

        // 평균 색상 비교: 전체적인 색감/조명 유사도를 보조 지표로 사용
        function computeAvgColor(img) {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) {
                r += data[i]; g += data[i + 1]; b += data[i + 2];
                count++;
            }
            return { r: r / count, g: g / count, b: b / count };
        }

        function colorSimilarity(colorA, colorB) {
            const dist = Math.sqrt(
                Math.pow(colorA.r - colorB.r, 2) +
                Math.pow(colorA.g - colorB.g, 2) +
                Math.pow(colorA.b - colorB.b, 2)
            );
            const maxDist = Math.sqrt(3 * 255 * 255);
            return 1 - dist / maxDist;
        }

        async function compareImageSimilarity(imgA, imgB) {
            const hashSim = hashSimilarity(computeDHash(imgA), computeDHash(imgB));
            const colorSim = colorSimilarity(computeAvgColor(imgA), computeAvgColor(imgB));
            return hashSim * 0.6 + colorSim * 0.4;
        }

        async function handlePhotoCapture(event) {
            const loc = LOCATIONS[currentLocIndex];
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const resultBox = document.getElementById('photo-result-box');
            const previewBox = document.getElementById('photo-preview-box');
            const checkBtn = document.getElementById('photo-check-btn');

            const reader = new FileReader();

                        loadImageEl(photoDataUrl),

                    const percent = Math.round(similarity * 100);

        function renderDragPuzzle(container) {
            container.innerHTML += `
                <div class="space-y-4">
                    <div class="grid grid-cols-3 gap-1 bg-slate-950 p-2 border border-slate-700 rounded w-full max-w-[280px] mx-auto aspect-[3/4]" id="puzzle-grid">
                        ${puzzleGridState.map((pieceIdx, slotIdx) => `
                            <div ondragover="allowDrop(event)" ondrop="dropPiece(event, ${slotIdx})" 
                                 onclick="returnPieceToVault(${slotIdx})"
                                 class="puzzle-drop-zone relative border border-dashed border-slate-700 rounded flex items-center justify-center overflow-hidden bg-slate-900/50">
                                ${pieceIdx !== null ? getPieceHTML(pieceIdx, slotIdx) : `<span class="text-[10px] text-slate-600">${slotIdx+1}</span>`}
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-slate-900/80 p-2 border border-slate-700 rounded"
                         ondragover="allowDrop(event)" ondrop="dropToVault(event)">
                        <p class="text-[11px] text-slate-400 mb-2 text-center">조각을 드래그하여 옮기거나 클릭하세요.</p>
                        <div class="grid grid-cols-3 gap-1.5 min-h-[100px]" id="puzzle-vault">
                            ${availablePuzzlePieces.map(pieceIdx => `
                                <div class="aspect-[3/4] border border-slate-600 rounded overflow-hidden">
                                    ${getPieceHTML(pieceIdx, null)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getPieceHTML(pieceIdx, currentSlot) {
            const row = Math.floor(pieceIdx / 3);
            const col = pieceIdx % 3;
            const fromSlotStr = currentSlot !== null ? currentSlot : 'vault';

            return `
                <div draggable="true" 
                     ondragstart="dragPiece(event, ${pieceIdx}, '${fromSlotStr}')"
                     onclick="event.stopPropagation(); ${currentSlot !== null ? `returnPieceToVault(${currentSlot})` : `autoPlacePiece(${pieceIdx})`}"
                     class="puzzle-piece w-full h-full"
                     style="background-image: url('${PUZZLE_IMAGE}'); background-size: 300% 300%; background-position: ${col * 50}% ${row * 50}%;">
                </div>
            `;
        }

        function allowDrop(ev) { ev.preventDefault(); }

        function dragPiece(ev, pieceIdx, fromSlot) {
            ev.dataTransfer.setData("pieceIdx", pieceIdx);
            ev.dataTransfer.setData("fromSlot", fromSlot);
        }

        function dropPiece(ev, targetSlotIdx) {
            ev.preventDefault();
            const pieceIdx = parseInt(ev.dataTransfer.getData("pieceIdx"));
            const fromSlot = ev.dataTransfer.getData("fromSlot");

            if (fromSlot !== 'vault') {
                const sourceSlotIdx = parseInt(fromSlot);
                puzzleGridState[sourceSlotIdx] = null;
            } else {
                availablePuzzlePieces = availablePuzzlePieces.filter(p => p !== pieceIdx);
            }

            if (puzzleGridState[targetSlotIdx] !== null) {
                availablePuzzlePieces.push(puzzleGridState[targetSlotIdx]);
            }

            puzzleGridState[targetSlotIdx] = pieceIdx;
            refreshPuzzle();
        }

        function dropToVault(ev) {
            ev.preventDefault();
            const pieceIdx = parseInt(ev.dataTransfer.getData("pieceIdx"));
            const fromSlot = ev.dataTransfer.getData("fromSlot");

            if (fromSlot !== 'vault') {
                const sourceSlotIdx = parseInt(fromSlot);
                puzzleGridState[sourceSlotIdx] = null;
                availablePuzzlePieces.push(pieceIdx);
                refreshPuzzle();
            }
        }

        function autoPlacePiece(pieceIdx) {
            const firstEmptySlot = puzzleGridState.findIndex(s => s === null);
            if (firstEmptySlot !== -1) {
                puzzleGridState[firstEmptySlot] = pieceIdx;
                availablePuzzlePieces = availablePuzzlePieces.filter(p => p !== pieceIdx);
                refreshPuzzle();
            }
        }

        function returnPieceToVault(slotIdx) {
            const pieceIdx = puzzleGridState[slotIdx];
            if (pieceIdx === null) return;
            puzzleGridState[slotIdx] = null;
            availablePuzzlePieces.push(pieceIdx);
            refreshPuzzle();
        }

        function refreshPuzzle() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = `<p class="font-bold text-sm mb-3 text-slate-200">${LOCATIONS[3].question}</p>`;
            renderDragPuzzle(container);
        }

        function checkAnswer() {
            const loc = LOCATIONS[currentLocIndex];
            let isCorrect = false;

            if (loc.type === 'choice') {
                const selected = document.querySelector('input[name="quiz-opt"]:checked');
                if (selected && parseInt(selected.value) === loc.answer) isCorrect = true;
            } else if (loc.type === 'short' || loc.type === 'final') {
                const val = document.getElementById('short-answer').value.trim();
                if (val.replace(/\s+/g, '') === loc.answer.replace(/\s+/g, '')) isCorrect = true;
            } else if (loc.type === 'map') {
                if (currentMapSequence.length === 6) isCorrect = true;
            } else if (loc.type === 'puzzle') {
                if (JSON.stringify(puzzleGridState) === JSON.stringify([0, 1, 2, 3, 4, 5, 6, 7, 8])) isCorrect = true;
            }

            if (isCorrect) {
                if (currentLocIndex === LOCATIONS.length - 1) {
                    triggerGameSuccess();
                } else {
                    alert("정답입니다! 다음 장소 안내 정보를 확인하세요.");
                    document.getElementById('next-loc-img').src = loc.nextGuideImg;
                    showStep('guide');
                }
            } else {
                alert("정답이 아닙니다! 다시 한 번 확인해 보세요.");
                increaseAlert(10);
            }
        }

        function proceedToNextLocation() {
            if (currentLocIndex < LOCATIONS.length - 1) {
                loadLocation(currentLocIndex + 1);
            }
        }

        function openQRScanner() {
            const qrModal = document.getElementById('qr-modal');
            qrModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');

            html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    const loc = LOCATIONS[currentLocIndex];
                    if (decodedText === loc.qrCode || decodedText === loc.fallbackCode) {
                        alert("QR 스캔 성공! 문제가 해제되었습니다.");
                        stopQRScanner();
                        proceedAfterAuth(loc);
                    } else {
                        alert("올바른 장소의 QR 코드가 아닙니다.");
                    }
                },
                () => {}
            ).catch(() => {
                alert("카메라를 시작할 수 없습니다. 비상 코드로 인증해주세요.");
                qrModal.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
                html5QrCode = null;
            });
        }

        // 이미 멈췄거나 시작되지 않은 스캐너를 다시 멈추려 할 때 예외가 나면
        // 뒤이어 실행돼야 할 화면 전환(proceedAfterAuth)까지 막혀버리므로,
        // 어떤 경우에도 예외가 밖으로 새지 않도록 방어한다.
        function stopQRScanner() {
            const closeModal = () => {
                document.getElementById('qr-modal').classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            };
            if (!html5QrCode) {
                closeModal();
                return;
            }
            const scanner = html5QrCode;
            html5QrCode = null;
            try {
                scanner.stop().then(closeModal).catch(closeModal);
            } catch (e) {
                closeModal();
            }
        }

        function submitManualCode() {
            const code = document.getElementById('manual-code').value.trim();
            const loc = LOCATIONS[currentLocIndex];
            if (code === loc.fallbackCode) {
                alert("비상 인증 성공!");
                try { stopQRScanner(); } catch (e) {}
                proceedAfterAuth(loc);
            } else {
                alert("올바르지 않은 비상 코드입니다.");
            }
        }

        function useCharacterSkill() {
            if (isSkillUsed) {
                alert("특수 스킬은 게임 당 1회만 사용 가능합니다!");
                return;
            }

            const loc = LOCATIONS[currentLocIndex];
            isSkillUsed = true;
            document.getElementById('skill-btn').classList.add('opacity-50', 'cursor-not-allowed');

            switch (selectedChar.id) {
                case 'jang':
                    if (loc.type === 'choice') {
                        const labels = document.querySelectorAll('#choice-options label');
                        let removed = 0;
                        labels.forEach((lbl, i) => {
                            if (i !== loc.answer && removed < 2) {
                                lbl.style.display = 'none';
                                removed++;
                            }
                        });
                        alert("[장재성 스킬] 오답 보기 2개가 제거되었습니다!");
                    } else {
                        decreaseAlert(5);
                        alert("[스킬 발동] 경계 수치가 5% 감소했습니다.");
                    }
                    break;
                case 'guk':
                    decreaseAlert(15);
                    alert("[국채진 스킬] 경계 수치가 15% 감소했습니다!");
                    break;
                case 'park':
                    if (loc.type === 'map') {
                        clickMapPin(currentMapSequence.length + 1);
                        alert("[박준채 스킬] 다음 경로 지점을 클릭했습니다!");
                    } else if (loc.type === 'puzzle') {
                        puzzleGridState = [0, 1, 2, 3, 4, 5, 6, 7, 8];
                        availablePuzzlePieces = [];
                        refreshPuzzle();
                        alert("[박준채 스킬] 퍼즐 조각이 완벽하게 맞춰졌습니다!");
                    } else {
                        alert("[박준채 스킬] 지형지물 단서를 확인했습니다.");
                    }
                    break;
                case 'lee':
                    if (loc.type === 'short' || loc.type === 'final') {
                        const hintEl = document.getElementById('short-hint');
                        hintEl.innerText = `[이광춘 힌트] 정답: ${loc.answer}`;
                        hintEl.classList.remove('hidden');
                        alert("[이광춘 스킬] 정답 힌트가 공개되었습니다!");
                    } else {
                        alert("[이광춘 스킬] 암호 단서를 확보했습니다.");
                    }
                    break;
                case 'kim':
                    timerSeconds += 120;
                    alert("[김귀임 스킬] 제한시간이 2분 연장되었습니다!");
                    break;
            }
        }

        function triggerGameOver(reason) {
            clearInterval(timerInterval);
            clearInterval(alertInterval);
            clearInterval(locTimerInterval);

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('status-bar').classList.add('hidden');
            
            const endingEl = document.getElementById('ending-screen');
            endingEl.classList.remove('hidden');

            document.getElementById('ending-icon').innerText = "🚨";
            document.getElementById('ending-title').innerText = "작전 실패";
            document.getElementById('ending-title').className = "text-2xl font-bold text-red-500";
            document.getElementById('ending-desc').innerText = reason;
        }

        function triggerGameSuccess() {
            clearInterval(timerInterval);
            clearInterval(alertInterval);
            clearInterval(locTimerInterval);

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('status-bar').classList.add('hidden');

            const endingEl = document.getElementById('ending-screen');
            endingEl.classList.remove('hidden');

            document.getElementById('ending-icon').innerText = "🇰🇷";
            document.getElementById('ending-title').innerText = "대한 독립 만세!";
            document.getElementById('ending-title').className = "text-2xl font-bold text-amber-400";
            document.getElementById('ending-desc').innerHTML = `
                <strong>1929년 11월, 당신들의 용기가 전국의 학생들을 깨웠습니다!</strong><br><br>
                평촌고등학교 교정에 남겨진 역사의 숨결을 따라 모든 미션을 완수했습니다.<br>
                독립을 향한 학생들의 뜨거운 열망을 기억해 주세요.
            `;
        }
    </script>
</body>
